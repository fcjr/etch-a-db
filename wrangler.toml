name = "etch-a-db"
main = "worker/index.js"
compatibility_date = "2026-05-17"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[routes]]
pattern = "etchadb.com"
custom_domain = true

[[routes]]
pattern = "www.etchadb.com"
custom_domain = true

[observability]
enabled = true
